name = "azurecord-api"
main = "desktop/cloud/worker-v0.8.2.js"
compatibility_date = "2026-09-30"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "azurecord-prod"
database_id = "__AZURECORD_D1_DATABASE_ID__"

[[durable_objects.bindings]]
name = "REALTIME"
class_name = "AzurecordRealtime"

[exports.AzurecordRealtime]
type = "durable-object"
storage = "sqlite"
