name: Android Native APK

on:
  push:
    branches:
      - main
      - fix/2.0.4-azurecall-native-android
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/**"
      - "desktop/renderer/**"
      - "realtime/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azurecord-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler versão Android
        shell: bash
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão Android inválida: $VERSION"
            exit 1
          fi
          echo "AZURECORD_ANDROID_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AZURECORD_ANDROID_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Detectar chave permanente
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "AZURECORD_SIGNED_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "AZURECORD_SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "::warning::Chave Android permanente ainda não configurada. O job gerará somente APK de teste e não publicará um APK atualizável."
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android 36 SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Preparar assinatura permanente
        if: env.AZURECORD_SIGNED_BUILD == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/azurecord-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "AZURECORD_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "AZURECORD_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AZURECORD_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AZURECORD_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          if [[ "$AZURECORD_SIGNED_BUILD" == "true" ]]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Preparar APK
        shell: bash
        run: |
          if [[ "$AZURECORD_SIGNED_BUILD" == "true" ]]; then
            SRC="android/app/build/outputs/apk/release/app-release.apk"
            DST="android/app/build/outputs/apk/release/Azurecord-Android-$AZURECORD_ANDROID_VERSION.apk"
          else
            SRC="android/app/build/outputs/apk/debug/app-debug.apk"
            DST="android/app/build/outputs/apk/debug/Azurecord-Android-$AZURECORD_ANDROID_VERSION-UNSIGNED-TEST.apk"
          fi
          test -f "$SRC"
          cp "$SRC" "$DST"
          echo "AZURECORD_APK_PATH=$DST" >> "$GITHUB_ENV"

      - name: Salvar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: Azurecord-Android-${{ env.AZURECORD_ANDROID_VERSION }}-${{ env.AZURECORD_SIGNED_BUILD == 'true' && 'SIGNED' || 'UNSIGNED-TEST' }}
          path: ${{ env.AZURECORD_APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK assinado no GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AZURECORD_SIGNED_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$AZURECORD_ANDROID_TAG" >/dev/null 2>&1; then
            gh release create "$AZURECORD_ANDROID_TAG" \
              --title "Azurecord $AZURECORD_ANDROID_VERSION" \
              --notes "Azurecord $AZURECORD_ANDROID_VERSION stable release."
          fi
          gh release upload "$AZURECORD_ANDROID_TAG" "$AZURECORD_APK_PATH" --clobber
